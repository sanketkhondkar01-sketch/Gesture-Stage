<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1a2e;--violet:#6c4dff;--mint:#2fd6a5;--coral:#ff6b6b;--sun:#ffc93c;--bg:#f4f5fb;--line:#d9dbea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 270px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font:700 clamp(28px,5vw,44px)/1.05 "Bricolage Grotesque",system-ui,sans-serif}
h1 small{display:block;margin-top:8px;font:400 16px/1.5 system-ui,sans-serif;color:#55557a}
.stage{position:relative;aspect-ratio:4/3;background:var(--ink);border-radius:18px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:cover;transform:scaleX(-1);opacity:.5}
#now{position:absolute;left:14px;bottom:12px;color:#fff;font-weight:600;background:rgba(27,26,46,.7);padding:4px 12px;border-radius:99px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:#fff}
#overlay[hidden]{display:none}
button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:12px 26px;background:var(--violet);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
#err{color:#ffb4b4;margin:0;max-width:34ch}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,background .15s}
li b{font-size:22px;width:30px;text-align:center}
li span{display:block;font-size:14px;color:#55557a}
li.on{border-color:var(--violet);background:#efeaff}
</style>
</head>
<body>
<main>
  <h1>Gesture Stage<small>Show your hand to the webcam. Each gesture plays its own animation.</small></h1>

  <div class="stage">
    <video id="v" playsinline muted></video>
    <canvas id="c"></canvas>
    <div id="now">Show your hand</div>
    <div id="overlay">
      <button id="start">Start camera</button>
      <p id="err" role="alert"></p>
    </div>
  </div>

  <ul id="legend">
    <li data-g="open"><b>🖐</b><div>Open palm<span>Color burst</span></div></li>
    <li data-g="fist"><b>✊</b><div>Fist<span>Shockwave rings</span></div></li>
    <li data-g="peace"><b>✌️</b><div>Peace<span>Confetti shower</span></div></li>
    <li data-g="thumb"><b>👍</b><div>Thumbs up<span>Floating hearts</span></div></li>
    <li data-g="point"><b>☝️</b><div>Point<span>Draw a glowing trail</span></div></li>
    <li data-g="pinch"><b>👌</b><div>Pinch<span>Energy orb</span></div></li>
  </ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const $ = s => document.querySelector(s);
const video = $('#v'), cv = $('#c'), ctx = cv.getContext('2d');
const NAMES = {open:'Open palm',fist:'Fist',peace:'Peace',thumb:'Thumbs up',point:'Point',pinch:'Pinch'};
const COLORS = ['#6c4dff','#2fd6a5','#ff6b6b','#ffc93c','#ffffff'];
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let W = 0, H = 0, hand = null, cur = null, cand = null, count = 0, frame = 0, hands;
const parts = [], trail = [];

function fit(){
  const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1;
  cv.width = W = Math.round(r.width * k); cv.height = H = Math.round(r.height * k);
}
addEventListener('resize', fit); fit();

const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pt = p => ({x: (1 - p.x) * W, y: p.y * H});
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = () => COLORS[Math.floor(Math.random() * COLORS.length)];

function classify(l){
  const s = d(l[0], l[9]) || 1;
  const ext = (t, p) => d(l[t], l[0]) > d(l[p], l[0]) * 1.08;
  const idx = ext(8,6), mid = ext(12,10), rng = ext(16,14), pnk = ext(20,18);
  if (d(l[4], l[8]) < s * 0.3 && mid) return 'pinch';
  if (idx && mid && rng && pnk) return 'open';
  if (!idx && !mid && !rng && !pnk)
    return l[4].y < l[5].y - s * 0.4 ? 'thumb' : 'fist';
  if (idx && mid && !rng && !pnk) return 'peace';
  if (idx && !mid && !rng && !pnk) return 'point';
  return null;
}

function onResults(r){
  hand = r.multiHandLandmarks && r.multiHandLandmarks[0] || null;
  const g = hand ? classify(hand) : null;
  if (g === cand) count++; else { cand = g; count = 1; }
  if (count >= 4 && cur !== cand){
    cur = cand;
    $('#now').textContent = cur ? NAMES[cur] : 'Show your hand';
    document.querySelectorAll('li').forEach(li => li.classList.toggle('on', li.dataset.g === cur));
    if (cur === 'fist') ring(pt(hand[9]));
  }
}

function ring(p){ parts.push({t:'ring', x:p.x, y:p.y, r:10, life:36, max:36, c:'#ff6b6b'}); }

function emit(){
  if (!hand) return;
  const p = pt(hand[9]), u = W / 640;
  if (cur === 'open'){
    for (let i = 0; i < 6; i++){
      const a = rnd(0, 6.283), v = rnd(2, 7) * u;
      parts.push({t:'dot', x:p.x, y:p.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:0, life:45, max:45, s:rnd(3,8)*u, c:pick()});
    }
  } else if (cur === 'peace'){
    for (let i = 0; i < 4; i++)
      parts.push({t:'conf', x:p.x + rnd(-40,40)*u, y:p.y, vx:rnd(-3,3)*u, vy:rnd(-7,-2)*u, g:.22*u, rot:rnd(0,6), vr:rnd(-.3,.3), life:80, max:80, s:rnd(6,12)*u, c:pick()});
  } else if (cur === 'thumb'){
    if (frame % 3 === 0)
      parts.push({t:'heart', x:p.x + rnd(-30,30)*u, y:p.y, vx:rnd(-.6,.6)*u, vy:-2.4*u, life:80, max:80, s:rnd(22,44)*u, c:'#ff6b6b'});
  } else if (cur === 'fist'){
    if (frame % 22 === 0) ring(p);
  }
}

function draw(){
  frame++;
  ctx.clearRect(0, 0, W, H);

  if (hand){
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2 * W / 640;
    ctx.beginPath();
    BONES.forEach(([a, b]) => { const A = pt(hand[a]), B = pt(hand[b]); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); });
    ctx.stroke();
  }

  emit();

  if (hand && cur === 'point') trail.push(pt(hand[8]));
  else if (trail.length) trail.shift();
  if (trail.length > 40) trail.shift();
  if (trail.length > 1){
    ctx.lineCap = 'round';
    for (let i = 1; i < trail.length; i++){
      const f = i / trail.length;
      ctx.strokeStyle = `rgba(47,214,165,${f})`; ctx.lineWidth = f * 14 * W / 640;
      ctx.shadowColor = '#2fd6a5'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  if (hand && cur === 'pinch'){
    const a = pt(hand[4]), b = pt(hand[8]);
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    const r = d(hand[0], hand[9]) * W * (0.7 + 0.12 * Math.sin(frame / 5));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, '#fff'); g.addColorStop(.35, '#a99bff'); g.addColorStop(1, 'rgba(108,77,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }

  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i];
    if (--q.life <= 0){ parts.splice(i, 1); continue; }
    const f = q.life / q.max;
    ctx.globalAlpha = f; ctx.fillStyle = q.c; ctx.strokeStyle = q.c;
    if (q.t === 'ring'){
      q.r += 9 * W / 640;
      ctx.lineWidth = 6 * W / 640 * f; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.stroke();
      continue;
    }
    q.x += q.vx; q.y += q.vy; q.vy += q.g || 0;
    if (q.t === 'dot'){ ctx.beginPath(); ctx.arc(q.x, q.y, q.s * f + 1, 0, 6.283); ctx.fill(); }
    else if (q.t === 'conf'){
      q.rot += q.vr; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
    } else if (q.t === 'heart'){
      ctx.font = q.s + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillText('♥', q.x, q.y);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

async function detectLoop(){
  if (video.readyState >= 2) await hands.send({image: video});
  requestAnimationFrame(detectLoop);
}

async function start(){
  const btn = $('#start'), err = $('#err');
  err.textContent = '';
  try {
    if (!window.Hands) throw new Error('lib');
    btn.disabled = true; btn.textContent = 'Starting…';
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:640, height:480, facingMode:'user'}});
    video.srcObject = stream; await video.play();
    hands = new Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f});
    hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:.6, minTrackingConfidence:.5});
    hands.onResults(onResults);
    $('#overlay').hidden = true;
    fit(); detectLoop();
  } catch (e){
    btn.disabled = false; btn.textContent = 'Try again';
    err.textContent = e.message === 'lib'
      ? "The hand-tracking library didn't load. Check your internet connection and reload."
      : 'Camera is blocked. Allow camera access in the address bar, then try again.';
  }
}
$('#start').addEventListener('click', start);
draw();
</script>
</body>
</html>
